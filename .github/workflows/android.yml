name: Android verification

on:
  push:
    branches: [main, 'verify/android-*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard public runners only. Do not consume private-repository minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.13
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output gradle.zip https://downloads.gradle.org/distributions/gradle-8.13-bin.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  gradle.zip' | sha256sum --check
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Prepare Android SDK and disposable emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/chromantis-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'emulator' \
            'system-images;android-36;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name chromantis --path "$ANDROID_AVD_HOME/chromantis.avd" \
            --package 'system-images;android-36;google_apis;x86_64'
          test -f "$ANDROID_AVD_HOME/chromantis.ini"
          "$ANDROID_HOME/platform-tools/adb" version
      - name: Start synthetic index-only HTTPS service
        run: |
          python3 -m venv "$RUNNER_TEMP/fixture-venv"
          "$RUNNER_TEMP/fixture-venv/bin/pip" install '.[thumbnails]'
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=Chromantis-Fixture \
            -addext 'subjectAltName=IP:10.0.2.2' \
            -keyout "$RUNNER_TEMP/fixture-key.pem" -out "$RUNNER_TEMP/fixture-cert.pem"
          PYTHONPATH=src "$RUNNER_TEMP/fixture-venv/bin/python" tests/android_instrumentation_fixture.py \
            --cert "$RUNNER_TEMP/fixture-cert.pem" --key "$RUNNER_TEMP/fixture-key.pem" \
            --config android/src/androidTest/assets/fixture.json > "$RUNNER_TEMP/fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fixture.pid"
          for attempt in {1..30}; do
            kill -0 "$(cat "$RUNNER_TEMP/fixture.pid")" || { cat "$RUNNER_TEMP/fixture.log"; exit 1; }
            if [ -s android/src/androidTest/assets/fixture.json ]; then break; fi
            sleep 1
          done
          test -s android/src/androidTest/assets/fixture.json
      - name: Check Kotlin, unit tests, debug APKs and lint
        run: >-
          gradle -p android --no-daemon --max-workers=2
          spotlessCheck testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Boot emulator and test Android integration
        run: |
          test -r /dev/kvm && test -w /dev/kvm || sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd chromantis -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -memory 2048 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in {1..150}; do
            kill -0 "$emulator_pid" || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1
          adb shell input keyevent 82
          gradle -p android --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.captureScreenshots=true
      - name: Print synthetic Compose screenshots
        run: |
          for name in sign-in-light folders-light anniversary-light anniversary-dark classify-light albums-light gallery-light share-selection-light share-selection-dark original-light original-dark review-light folders-dark search-dark tags-light tags-dark tag-refinements-light tag-refinements-dark photo-tag-person-light photo-tag-person-dark photo-tag-year-light photo-tag-year-dark album-shortcut-light album-shortcut-dark photo-shortcut-light photo-shortcut-dark saved-tag-light saved-tag-dark bookmark-catalog-light bookmark-catalog-dark search-return-light search-return-dark album-search-return-light album-search-return-dark collage-light collage-dark search-collage-light search-collage-dark collage-recovery-light collage-recovery-dark sign-in-dark; do
            echo "CHROMANTIS_SCREENSHOT_BEGIN:$name"
            adb exec-out cat "/sdcard/Download/chromantis-compose/$name.png" > "$RUNNER_TEMP/$name.png"
            python3 -c 'from pathlib import Path; import sys; assert Path(sys.argv[1]).read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))' "$RUNNER_TEMP/$name.png"
            base64 "$RUNNER_TEMP/$name.png"
            echo
            echo "CHROMANTIS_SCREENSHOT_END:$name"
          done
      - name: Sign and verify the installable test APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_TEST_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || ! "$EXPECTED_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Configure the persistent Android test signing secrets and certificate fingerprint."
            exit 1
          fi
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/chromantis-signing.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset KEYSTORE_BASE64
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          output="$RUNNER_TEMP/chromantis-apk"
          mkdir -p "$output"
          "$signer" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias chromantis-test \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$output/Chromantis-debug.apk" android/build/outputs/apk/debug/Chromantis-debug.apk
          verification="$("$signer" verify --verbose --print-certs "$output/Chromantis-debug.apk")"
          printf '%s\n' "$verification"
          grep -Fxq 'Number of signers: 1' <<< "$verification"
          grep -Fxq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" <<< "$verification"
          cd "$output"
          sha256sum Chromantis-debug.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload verified test APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromantis-debug-${{ github.sha }}
          path: ${{ runner.temp }}/chromantis-apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          lines = ["## Android verification"]
          for label, folder in [("JVM", "test-results/testDebugUnitTest"), ("Android integration", "outputs/androidTest-results/connected/debug")]:
              reports = [ET.parse(p).getroot() for p in Path("android/build", folder).rglob("TEST-*.xml")]
              counts = {key: sum(int(r.get(key, "0")) for r in reports) for key in ["tests", "failures", "errors", "skipped"]}
              lines.append(f"- {label}: " + ", ".join(f"{key}={value}" for key, value in counts.items()))
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          PYTHON
      - name: Show failure diagnostics
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/emulator.log" ]; then tail -100 "$RUNNER_TEMP/emulator.log"; fi
          timeout 15s adb logcat -d -s ChromantisFixture:I AndroidRuntime:E || true
          find android/build/outputs/androidTest-results -name '*.xml' -exec cat {} + 2>/dev/null || true
      - name: Stop disposable emulator
        if: always()
        run: |
          timeout 15s adb emu kill || true
          if [ -f "$RUNNER_TEMP/fixture.pid" ]; then kill "$(cat "$RUNNER_TEMP/fixture.pid")" || true; fi
