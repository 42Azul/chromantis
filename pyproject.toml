[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromantis"
version = "0.1.0"
description = "Deterministic FTP photo index and Telegram retrieval bot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21,<22"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
