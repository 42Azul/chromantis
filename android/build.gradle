import java.util.Properties

plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21'
    id 'com.diffplug.spotless' version '7.2.1'
}

def releaseSigning = new Properties()
def releaseSigningFile = file('keystore.properties')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def signingValue = { String propertyName, String environmentName ->
    releaseSigning.getProperty(propertyName) ?: System.getenv(environmentName)
}
def releaseStoreFile = signingValue('storeFile', 'CHROMANTIS_KEYSTORE_PATH')
def releaseStorePassword = signingValue('storePassword', 'CHROMANTIS_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'CHROMANTIS_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'CHROMANTIS_KEY_PASSWORD')
def releaseSigningReady = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { it != null && !it.isBlank() }
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
if (releaseRequested && !releaseSigningReady) {
    throw new GradleException(
        'Release signing is required. Copy keystore.properties.example to keystore.properties ' +
            'or set the CHROMANTIS_KEYSTORE_* environment variables.'
    )
}

android {
    namespace 'org.chromantis.android'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'org.chromantis.android'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

spotless {
    kotlin {
        target 'src/**/*.kt'
        ktfmt('0.58').kotlinlangStyle()
    }
}
